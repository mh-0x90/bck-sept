<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign up · CompanyEmail</title>
  <link rel="stylesheet" href="/static/look.css">
</head>
<body>
<main class="card">
  <h1>Create account</h1>
  <p>Your user and team addresses are generated automatically on <strong>@{{ domain }}</strong>.</p>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username<input name="username" minlength="3" maxlength="32" required autocomplete="username"></label>
    <label>Password<input name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label>
    <label>Team
      <select name="team_id" required>
        {% for team in teams %}<option value="{{ team.id }}">{{ team.name }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">Sign up</button>
  </form>
  <p><a href="/login">Already have an account?</a></p>
</main>
</body>
</html>
