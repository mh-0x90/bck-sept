<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents Management - Export Workspace</title>
  <style>
    :root{color-scheme:dark;--bg:#07080a;--panel:#0d1014;--panel2:#12161c;--line:#242b34;--text:#f5f7fa;--muted:#9aa5b1;--accent:#91b9ff;--ok:#98d6b8;--err:#d7a2a2}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    main{max-width:1100px;margin:auto;padding:32px 16px}
    header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px}
    h1{margin:0;font-size:1.6rem}
    nav{margin-bottom:20px;display:flex;gap:12px}
    nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-size:0.85rem}
    nav a.active{color:var(--text);background:var(--panel2);border-color:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
    .card h2{margin-top:0;font-size:1.1rem;color:var(--accent)}
    label{display:block;margin:10px 0 4px;font-size:0.8rem;color:var(--muted)}
    input,textarea,select{width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--text);font-family:inherit;font-size:0.85rem}
    button{margin-top:12px;padding:8px 14px;background:#1e2838;color:#c9d8f1;border:1px solid #384555;border-radius:6px;font-weight:600;font-size:0.85rem;cursor:pointer}
    button:hover{background:#263448;border-color:var(--accent)}
    .status-badge{font-size:0.8rem;padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel2)}
    pre{background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:6px;font-size:0.75rem;overflow-x:auto;max-height:160px}
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Documents Management</h1>
        <small style="color:var(--muted)">Export & Distribution Portal</small>
      </div>
      <div>
        <span id="sessionInfo" class="status-badge">Not authenticated</span>
        <button id="logoutBtn" style="display:none;margin-top:0;margin-left:8px;" onclick="logout()">Logout</button>
      </div>
    </header>

    <nav>
      <a href="/">Basic Operations</a>
      <a href="/export" class="active">Tenant Export & Processing</a>
      <a href="/distribution">Distribution Tasks</a>
    </nav>

    <div class="grid">
      <div class="card">
        <h2>1. Schedule Document Export</h2>
        <label>Document ID</label>
        <input id="exportDocId" type="number" placeholder="1">
        <label>Destination Path</label>
        <input id="exportDest" placeholder="exports/report.txt">
        <label>Scheduled Timestamp (UTC)</label>
        <input id="exportTime" placeholder="YYYY-MM-DD HH:MM:SS (optional)">
        <button onclick="requestExport()">Queue Export Job</button>
        <pre id="exportOutput">-</pre>
      </div>

      <div class="card">
        <h2>2. Transfer Document Ownership</h2>
        <label>Document ID</label>
        <input id="transferDocId" type="number" placeholder="1">
        <label>New Tenant ID</label>
        <input id="transferTenantId" type="number" placeholder="2">
        <button onclick="transferDoc()">Transfer Ownership (Admin)</button>
        <pre id="transferOutput">-</pre>
      </div>

      <div class="card">
        <h2>3. Worker Runner & Job Status</h2>
        <label>Timestamp Override</label>
        <input id="workerTime" placeholder="Leave empty for current time">
        <button onclick="runWorker()">Run Background Worker</button>
        <hr style="border-color:var(--line);margin:14px 0">
        <label>Check Job ID</label>
        <input id="checkJobId" type="number" placeholder="1">
        <button onclick="checkJob()">Query Status</button>
        <pre id="workerOutput">-</pre>
      </div>
    </div>
  </main>

  <script>
    let authToken = localStorage.getItem('doc_token') || '';
    let currentUsername = localStorage.getItem('doc_user') || '';

    function updateSession() {
      const badge = document.getElementById('sessionInfo');
      const btn = document.getElementById('logoutBtn');
      if (authToken) {
        badge.textContent = `Logged in as: ${currentUsername}`;
        badge.style.borderColor = 'var(--ok)';
        btn.style.display = 'inline-block';
      } else {
        badge.textContent = 'Not authenticated';
        badge.style.borderColor = 'var(--line)';
        btn.style.display = 'none';
      }
    }

    function authHeaders() {
      const headers = {'Content-Type': 'application/json'};
      if (authToken) {
        headers['Authorization'] = `Bearer ${authToken}`;
      }
      return headers;
    }

    function logout() {
      authToken = '';
      currentUsername = '';
      localStorage.removeItem('doc_token');
      localStorage.removeItem('doc_user');
      updateSession();
    }

    async function requestExport() {
      const document_id = parseInt(document.getElementById('exportDocId').value, 10);
      const destination = document.getElementById('exportDest').value;
      const execute_at = document.getElementById('exportTime').value || undefined;
      const out = document.getElementById('exportOutput');
      const res = await fetch('/api/exports', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({document_id, destination, execute_at})
      });
      out.textContent = JSON.stringify(await res.json(), null, 2);
    }

    async function transferDoc() {
      const docId = document.getElementById('transferDocId').value;
      const new_tenant_id = parseInt(document.getElementById('transferTenantId').value, 10);
      const out = document.getElementById('transferOutput');
      const res = await fetch(`/api/documents/${docId}/transfer`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({new_tenant_id})
      });
      out.textContent = JSON.stringify(await res.json(), null, 2);
    }

    async function runWorker() {
      const current_time = document.getElementById('workerTime').value || undefined;
      const out = document.getElementById('workerOutput');
      const res = await fetch('/api/worker/run', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({current_time})
      });
      out.textContent = JSON.stringify(await res.json(), null, 2);
    }

    async function checkJob() {
      const jobId = document.getElementById('checkJobId').value;
      const out = document.getElementById('workerOutput');
      const res = await fetch(`/api/exports/${jobId}`, {
        method: 'GET',
        headers: authHeaders()
      });
      out.textContent = JSON.stringify(await res.json(), null, 2);
    }

    updateSession();
  </script>
</body>
</html>
