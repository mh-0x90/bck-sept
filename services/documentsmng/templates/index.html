<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documents Management Workspace</title>
  <style>
    :root{color-scheme:dark;--bg:#07080a;--panel:#0d1014;--panel2:#12161c;--line:#242b34;--text:#f5f7fa;--muted:#9aa5b1;--accent:#91b9ff;--ok:#98d6b8;--err:#d7a2a2}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    main{max-width:1100px;margin:auto;padding:32px 16px}
    header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:24px}
    h1{margin:0;font-size:1.6rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
    .card h2{margin-top:0;font-size:1.1rem;color:var(--accent)}
    label{display:block;margin:10px 0 4px;font-size:0.8rem;color:var(--muted)}
    input,textarea,select{width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--text);font-family:inherit;font-size:0.85rem}
    textarea{resize:vertical;min-height:60px}
    button{margin-top:12px;padding:8px 14px;background:#1e2838;color:#c9d8f1;border:1px solid #384555;border-radius:6px;font-weight:600;font-size:0.85rem;cursor:pointer}
    button:hover{background:#263448;border-color:var(--accent)}
    .status-badge{font-size:0.8rem;padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel2)}
    pre{background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:6px;font-size:0.75rem;overflow-x:auto;max-height:160px}
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Documents Management</h1>
        <small style="color:var(--muted)">Workspace Operations</small>
      </div>
      <div>
        <span id="sessionInfo" class="status-badge">Not authenticated</span>
        <button id="logoutBtn" style="display:none;margin-top:0;margin-left:8px;" onclick="logout()">Logout</button>
      </div>
    </header>

    <nav style="margin-bottom:20px;display:flex;gap:12px">
      <a href="/" style="color:var(--text);background:var(--panel2);border:1px solid var(--accent);text-decoration:none;padding:6px 12px;border-radius:6px;font-size:0.85rem">Basic Operations</a>
      <a href="/export" style="color:var(--muted);text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-size:0.85rem">Tenant Export & Processing</a>
      <a href="/distribution" style="color:var(--muted);text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:6px;font-size:0.85rem">Distribution Tasks</a>
    </nav>

    <div class="grid">
      <div class="card">
        <h2>1. User Authentication</h2>
        <label>Username</label>
        <input id="loginUser" value="alice">
        <label>Password</label>
        <input id="loginPass" type="password" value="AlicePassword123!">
        <button onclick="login()">Login</button>
        <pre id="loginOutput">Awaiting login...</pre>
      </div>

      <div class="card">
        <h2>2. Provision Tenant & User</h2>
        <label>Tenant Name</label>
        <input id="tenantName" placeholder="e.g. MarketingTeam">
        <button onclick="createTenant()">Create Tenant</button>
        <hr style="border-color:var(--line);margin:14px 0">
        <label>New Username</label>
        <input id="newUsername" placeholder="e.g. bob">
        <label>Password</label>
        <input id="newPassword" type="password" value="DefaultPass123!">
        <label>Tenant ID</label>
        <input id="newUserTenantId" type="number" placeholder="e.g. 1">
        <label>Role</label>
        <select id="newUserRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
        <button onclick="createUser()">Create User</button>
        <pre id="tenantUserOutput">-</pre>
      </div>

      <div class="card">
        <h2>3. Create Document</h2>
        <label>Title</label>
        <input id="docTitle" placeholder="e.g. Financial Report Q4">
        <label>Content</label>
        <textarea id="docContent" placeholder="Document body text..."></textarea>
        <button onclick="createDoc()">Save Document</button>
        <pre id="docOutput">-</pre>
      </div>
    </div>
  </main>

  <script>
    let authToken = localStorage.getItem('doc_token') || '';
    let currentUsername = localStorage.getItem('doc_user') || '';

    function updateSession() {
      const badge = document.getElementById('sessionInfo');
      const btn = document.getElementById('logoutBtn');
      if (authToken) {
        badge.textContent = `Logged in as: ${currentUsername}`;
        badge.style.borderColor = 'var(--ok)';
        btn.style.display = 'inline-block';
      } else {
        badge.textContent = 'Not authenticated';
        badge.style.borderColor = 'var(--line)';
        btn.style.display = 'none';
      }
    }

    function authHeaders() {
      const headers = {'Content-Type': 'application/json'};
      if (authToken) {
        headers['Authorization'] = `Bearer ${authToken}`;
      }
      return headers;
    }

    function logout() {
      authToken = '';
      currentUsername = '';
      localStorage.removeItem('doc_token');
      localStorage.removeItem('doc_user');
      updateSession();
    }

    async function login() {
      const u = document.getElementById('loginUser').value;
      const p = document.getElementById('loginPass').value;
      const out = document.getElementById('loginOutput');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: u, password: p})
        });
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
        if (res.ok && data.token) {
          authToken = data.token;
          currentUsername = u;
          localStorage.setItem('doc_token', authToken);
          localStorage.setItem('doc_user', currentUsername);
          updateSession();
        }
      } catch (err) {
        out.textContent = err.toString();
      }
    }

    async function createTenant() {
      const name = document.getElementById('tenantName').value;
      const out = document.getElementById('tenantUserOutput');
      const res = await fetch('/api/tenants', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({name})
      });
      out.textContent = JSON.stringify(await res.json(), null, 2);
    }

    async function createUser() {
      const username = document.getElementById('newUsername').value;
      const password = document.getElementById('newPassword').value;
      const tenant_id = parseInt(document.getElementById('newUserTenantId').value, 10);
      const role = document.getElementById('newUserRole').value;
      const out = document.getElementById('tenantUserOutput');
      const res = await fetch('/api/users', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({username, password, tenant_id, role})
      });
      out.textContent = JSON.stringify(await res.json(), null, 2);
    }

    async function createDoc() {
      const title = document.getElementById('docTitle').value;
      const content = document.getElementById('docContent').value;
      const out = document.getElementById('docOutput');
      const res = await fetch('/api/documents', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({title, content})
      });
      out.textContent = JSON.stringify(await res.json(), null, 2);
    }

    updateSession();
  </script>
</body>
</html>
