user mailbox;
worker_processes 1;
pid /tmp/runtime/nginx-mailbox.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    server {
        listen 0.0.0.0:8102;
        server_name _;
        root /opt/apps/mailbox/app_code;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
